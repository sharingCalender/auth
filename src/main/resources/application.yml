spring:
  application:
    name: auth-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://${username}:${password}@localhost:9000

  jwt:
    secret: ${secret.key}
    token:
      access-expiration-time: 600000
      refresh-expiration-time: 1200000

  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8350

oauth:
  naver:
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    redirect-uri: http://localhost:8580/oauth/naver/callback # 이거 프론트 포트번호로 해서 연결하고 다시 auth 로 api 통신해야할 듯
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    client-id: hBmsnnkZvG8jA3QHQ7Rx
    client-secret: e6jbNq6C1s
    grant-type: authorization_code


